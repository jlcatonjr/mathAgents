  ## Component Specification

  Evaluates the harness on benchmark subsets and a curated philosophy-of-science set, reporting success rates, gate interventions, and a failure taxonomy.

  ## Sections

  1. Benchmarks and Problem Sets
  2. Method
  3. Results
  4. Failure Taxonomy
  5. Limitations

  ## Sources

