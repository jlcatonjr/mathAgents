# mathAgents documentation site. Modelled on agentteams' and baseAgent's (same theme). Hand-written pages and the
# explorer live in docs_src/; the API reference pages, the CLI reference, stability.md, changelog.md,
# getting-started.md and explorer/{api,library}.json are GENERATED by scripts/build_api_site.py (gitignored, rebuilt by
# .github/workflows/docs.yml). Build: python3 scripts/build_api_site.py && mkdocs build --strict.
# Deployed by docs.yml only when the repository is public.
site_name: mathAgents
site_description: A proof-development harness where the Lean kernel judges validity and a human judges statement fidelity. CLI and API reference, and an interactive explorer.
site_url: https://jlcatonjr.github.io/mathAgents/
repo_url: https://github.com/jlcatonjr/mathAgents
repo_name: jlcatonjr/mathAgents
edit_uri: ""
docs_dir: docs_src
site_dir: _site
use_directory_urls: true
site_author: jlcatonjr
copyright: "mathAgents contributors"
extra:
  generator: false

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts: concepts.md
  - CLI Reference: cli-reference.md
  - API Reference:
      - Overview: api-reference/index.md
      - Dossiers and stages:
          - dossiers: api-reference/dossiers.md
          - preferences: api-reference/preferences.md
          - fidelity: api-reference/fidelity.md
          - axioms: api-reference/axioms.md
          - counterexamples: api-reference/counterexamples.md
          - evidence: api-reference/evidence.md
      - Kernel and names:
          - kernel: api-reference/kernel.md
          - snapshot: api-reference/snapshot.md
          - bindings: api-reference/bindings.md
          - name_index: api-reference/name-index.md
          - blueprint: api-reference/blueprint.md
      - Gates and registries:
          - gates: api-reference/gates.md
          - registries: api-reference/registries.md
          - machine: api-reference/machine.md
      - Command line and support:
          - cli: api-reference/cli.md
          - config: api-reference/config.md
          - results: api-reference/results.md
          - errors: api-reference/errors.md
  - Explorer: interactive-explorer.md
  - Proof Library: proof-library.md
  - Stability: stability.md
  - Changelog: changelog.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
