name: Docs (build; deploy to Pages once public)

# The documentation site and the interactive explorer (mkdocs.yml, docs_src/). Modelled on agentteams' and
# baseAgent's docs.yml.
#
# - build: on pull requests and pushes to main. `scripts/build_api_site.py` generates the API and CLI references and
#   the explorer's data through the documented mathagents API (its outputs are gitignored), then
#   `mkdocs build --strict` fails on a broken link or nav entry.
# - deploy: ONLY on a push to main or a manual run on main, and ONLY when the repository is public. While mathAgents
#   is private the condition is false and the job is skipped, so merging this publishes nothing. Before the first
#   deploy, enable Pages with source "GitHub Actions" (an operator step).
#
# Security: least-privilege token per job (build: contents read; deploy: pages write + id-token write, nothing
# else), no secrets, `pull_request` (never pull_request_target), actions pinned to commit SHAs, no persisted
# credentials, timeouts and a concurrency group. Build dependencies install only from
# .github/ci/requirements-docs.txt with --require-hashes (S-10; see its header for the certifi exception).

on:
  pull_request:
    branches: [main]
    paths:
      - "docs_src/**"
      - "mkdocs.yml"
      - "docs/api-reference/**"
      - "docs/module.md"
      - "STABILITY.md"
      - "CHANGELOG.md"
      - "mathagents/**"
      - "reports/dossiers/**"
      - "references/*.json"
      - "lean/lean-toolchain"
      - "lean/lake-manifest.json"
      - "lean/MathAgents/**"
      - "lean/MathAgentsWIP/**"
      - "scripts/build_api_site.py"
      - "scripts/check_api_doc_parity.py"
      - "scripts/dossier_structure.py"
      - "references/preferences.toml"
      - "scripts/proof_integrity.py"
      - "scripts/validate_dossier.py"
      - "scripts/lean_pin.py"
      - "README.md"
      - "tests/test_api_site.py"
      - "pyproject.toml"
      - ".github/ci/requirements-docs.txt"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:   # the same list as pull_request
      - "docs_src/**"
      - "mkdocs.yml"
      - "docs/api-reference/**"
      - "docs/module.md"
      - "STABILITY.md"
      - "CHANGELOG.md"
      - "mathagents/**"
      - "reports/dossiers/**"
      - "references/*.json"
      - "lean/lean-toolchain"
      - "lean/lake-manifest.json"
      - "lean/MathAgents/**"
      - "lean/MathAgentsWIP/**"
      - "scripts/build_api_site.py"
      - "scripts/check_api_doc_parity.py"
      - "scripts/dossier_structure.py"
      - "references/preferences.toml"
      - "scripts/proof_integrity.py"
      - "scripts/validate_dossier.py"
      - "scripts/lean_pin.py"
      - "README.md"
      - "tests/test_api_site.py"
      - "pyproject.toml"
      - ".github/ci/requirements-docs.txt"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "0 6 * * 2"   # weekly, so the explorer's data is rebuilt even when no listed path changed
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.11"
      - name: Install docs dependencies (hash-locked)
        run: python -m pip install --require-hashes --no-deps -r .github/ci/requirements-docs.txt
      - name: Site tests (nav, coverage, explorer sinks, pins)
        run: python -m pytest -q tests/test_api_site.py
      - name: Generate the API and CLI references and the explorer data
        run: python scripts/build_api_site.py
      - name: Build (strict)
        run: |
          python -m mkdocs build --strict --site-dir _site
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/api-reference/index.html
          test -s _site/cli-reference/index.html
          grep -q 'id="view-api"' _site/explorer/index.html
          test -s _site/explorer/api.json
          test -s _site/explorer/library.json
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
